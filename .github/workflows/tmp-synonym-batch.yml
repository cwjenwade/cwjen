name: Temporary synonym batch

on:
  pull_request:
    branches: [main]
    paths:
      - 'tmp/synonym_batch_20260725/**'
      - '.github/workflows/tmp-synonym-batch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-synonyms:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Fetch dictionary synonyms
        run: python tmp/synonym_batch_20260725/fetch_synonyms.py
      - name: Upload synonym results
        uses: actions/upload-artifact@v4
        with:
          name: synonym-results
          path: |
            tmp/synonym_batch_20260725/synonym_mapping.json
            tmp/synonym_batch_20260725/synonym_mapping.csv
            tmp/synonym_batch_20260725/synonym_audit_30.csv
          if-no-files-found: error
          retention-days: 1
