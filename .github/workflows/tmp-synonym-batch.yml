name: Temporary synonym batch

on:
  pull_request:
    branches: [main]
    paths:
      - 'tmp/synonym_batch_20260725/**'
      - '.github/workflows/tmp-synonym-batch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-synonyms:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Fetch definition-matched dictionary synonyms
        id: fetch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -u tmp/synonym_batch_20260725/fetch_sense_matched.py 2>&1 | tee tmp/synonym_batch_20260725/run.log
      - name: Upload synonym results and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synonym-results-sense
          path: |
            tmp/synonym_batch_20260725/synonym_mapping_sense.json
            tmp/synonym_batch_20260725/synonym_mapping_sense.csv
            tmp/synonym_batch_20260725/synonym_audit_sense_30.csv
            tmp/synonym_batch_20260725/run.log
          if-no-files-found: warn
          retention-days: 1
      - name: Fail if fetch failed
        if: steps.fetch.outcome == 'failure'
        run: exit 1
